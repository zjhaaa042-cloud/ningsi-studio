<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 移动/窄窗下也要能读，故显式声明视口 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="凝思 Studio：便携脑电专注力训练与心理状态评估">
<!-- 后端若以 --token 启动，需在此注入令牌（当前后端未注入，故默认空）；
     零依赖前提下这是唯一不需要弹窗/地址栏改造的认证通道。 -->
<meta name="ningsi-api-token" content="">
<title>凝思 Studio</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<!-- 顶栏固定：数据来源徽标 / 引擎口径 / 当前会话状态与进度 -->
<header class="topbar" role="banner">
  <div class="topbar__brand">
    <span class="topbar__logo" aria-hidden="true">凝</span>
    <span class="topbar__title">凝思 Studio</span>
  </div>
  <div class="topbar__meta">
    <span id="source-badge" class="badge" title="数据来源">数据来源：—</span>
    <span id="engine-badge" class="badge" title="引擎口径版本">口径：—</span>
    <span id="device-badge" class="badge" title="当前设备与数据源">设备：—</span>
  </div>
  <div class="topbar__session">
    <span id="session-state" class="badge" title="当前会话状态">会话：未选择</span>
    <div class="progress progress--slim" role="progressbar" aria-label="会话总进度"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="session-progress">
      <div class="progress__bar" id="session-progress-bar" style="width: 0%"></div>
    </div>
    <span id="session-percent" class="mono">—</span>
  </div>
</header>

<div class="layout">
  <nav class="sidenav" aria-label="主导航">
    <ul id="nav-list" class="sidenav__list"></ul>
    <div class="sidenav__foot">
      <p class="muted">结论仅用于研究与自我调节训练，不构成医疗诊断。</p>
    </div>
  </nav>
  <main id="view" class="view" role="main" tabindex="-1">
    <p class="muted">正在加载…</p>
  </main>
</div>

<!-- 全局可读提示条：网络与接口错误统一在这里显示，不用弹窗 -->
<div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
